# 本地一键全栈：docker compose up --build
#
# 服务清单：
#   db         — PostgreSQL 17
#   minio      — S3 兼容对象存储（轨迹文件）
#   minio-init — 一次性任务：创建 traces bucket
#   server     — API 服务（Python / FastAPI）
#   runner     — 评测 runner（可横向扩展）
#   web        — React 前端（nginx 托管 + /api 反代）
#   prometheus — 指标采集
#   grafana    — 指标可视化仪表盘
#
# 快速启动：
#   docker compose up --build
#
# 扩展 runner（压力测试，验证 SKIP LOCKED 并发领取）：
#   docker compose up --scale runner=4
#
# MinIO 控制台：http://localhost:9001  (admin/devpassword)
# Grafana：      http://localhost:3000  (admin/admin)
# Web：          http://localhost:5173

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────
  db:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: evalplatform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 15
    logging: *default-logging

  # ── MinIO（S3 兼容对象存储）──────────────────────────────────────────────
  minio:
    # 本地开发跟随 latest；生产环境固定 RELEASE tag 或镜像 digest
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: devpassword
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 管理控制台
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 10
    logging: *default-logging

  # MinIO 初始化：创建 traces bucket
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 admin devpassword &&
        mc mb --ignore-existing local/traces &&
        echo 'bucket ready'
      "
    restart: "no"

  # ── API 服务 ────────────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:dev@db:5432/evalplatform
      # 对象存储：使用 MinIO（纯本地开发可改 TRACE_BACKEND=local 去掉 minio 依赖）
      TRACE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: traces
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: devpassword
      S3_REGION: us-east-1
      # 内部路由鉴权（runner 需携带此 token；生产换成强密钥）
      RUNNER_SECRET: ${RUNNER_SECRET:-dev-runner-secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8081:8081"
    depends_on:
      db: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "/healthcheck.py"]
      interval: 5s
      retries: 12
    logging: *default-logging

  # ── Python Runner ───────────────────────────────────────────────────────
  runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    environment:
      EVAL_SERVER_URL: http://server:8081
      RUNNER_SECRET: ${RUNNER_SECRET:-dev-runner-secret}
      # 真实 Agent 调用时打开：
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      server: { condition: service_healthy }
    deploy:
      replicas: 2
    restart: unless-stopped
    logging: *default-logging

  # ── React 前端 ──────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "5173:8081"
    depends_on: [server]
    logging: *default-logging

  # ── Prometheus ──────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.12.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on: [server]
    logging: *default-logging

  # ── Grafana ─────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:13.0.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]
    logging: *default-logging

volumes:
  pgdata:
  miniodata:
  promdata:
  grafanadata:

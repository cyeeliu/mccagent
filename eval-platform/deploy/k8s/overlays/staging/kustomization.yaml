apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target: { kind: Deployment, name: server }
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target: { kind: Deployment, name: web }
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target: { kind: Deployment, name: runner }

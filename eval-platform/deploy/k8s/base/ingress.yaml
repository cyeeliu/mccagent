apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eval-platform
  annotations:
    # SSE 两件套：关缓冲 + 拉长读超时
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  rules:
    - host: eval.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: server, port: { number: 8081 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 8081 } } }

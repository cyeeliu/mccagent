[project]
name = "eval-runner"
version = "0.1.0"
description = "评测平台 Runner：领取任务、执行被测 Agent、上报轨迹事件"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runner"]

[project]
name = "mcc-cli"
version = "0.1.0"
description = "A CLI coding assistant with tool use, permissions, hooks, sessions and subagents."
readme = "README.md"
repository = "https://github.com/cyeeliu/mccagent"
requires-python = ">=3.12"
license = "MIT"
keywords = ["llm", "agent", "cli", "anthropic", "coding-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]
dependencies = [
    "mcc-core",
    "mcc-llm",
    "mcc-tools",
    "mcc-harness",
    "mcc-session",
    "mcc-config",
    "mcc-tui",
    "mcc-observability",
    "click>=8.1",
    "httpx>=0.27",
]

[project.scripts]
mcc = "mcc_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

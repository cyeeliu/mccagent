[project]
name = "eval-server"
version = "0.1.0"
description = "评测平台 API 服务：REST + SSE、租约调度、轨迹存储与指标暴露"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "asyncpg>=0.30",
    "prometheus-client>=0.21",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_server"]

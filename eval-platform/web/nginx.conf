server {
    listen 8081;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://server:8081;
        proxy_buffering off;          # SSE 必须关缓冲
        proxy_read_timeout 1h;        # 长连接别被默认 60s 掐死
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /healthz/ {
        proxy_pass http://server:8081;
    }
    location / { try_files $uri /index.html; }   # SPA 路由 fallback
}

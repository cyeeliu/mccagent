# 本地一键全栈：docker compose up --build
#
# 服务清单：
#   db         — PostgreSQL 17
#   server     — API 服务（Python / FastAPI）
#   runner     — 评测 runner（可横向扩展）
#   web        — React 前端（nginx 托管 + /api 反代）
#   prometheus — 指标采集
#   grafana    — 指标可视化仪表盘
#
# 轨迹后端缺省为 local（存 traces 卷）；生产环境通过 TRACE_BACKEND=s3
# 及 S3_* 环境变量接入真实对象存储（见 README「本地与生产的刻意不同」）。
#
# 快速启动：
#   docker compose up --build
#
# 扩展 runner（压力测试，验证 SKIP LOCKED 并发领取）：
#   docker compose up --scale runner=4
#
# Grafana：http://localhost:3000  (admin/admin)
# Web：    http://localhost:5173

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────
  db:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: evalplatform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 15
    logging: *default-logging

  # ── API 服务 ────────────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:dev@db:5432/evalplatform
      # 轨迹存容器卷（local 后端）；生产接真实对象存储时改 TRACE_BACKEND=s3
      TRACE_DIR: /traces
      # 内部路由鉴权（runner 需携带此 token；生产换成强密钥）
      RUNNER_SECRET: ${RUNNER_SECRET:-dev-runner-secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - traces:/traces
    ports:
      - "${SERVER_PORT:-8081}:8081"
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "/healthcheck.py"]
      interval: 5s
      retries: 12
    logging: *default-logging

  # ── Python Runner ───────────────────────────────────────────────────────
  # 构建上下文为仓库根（镜像内置 mcc 源码，compose up 后即可直接评测
  # mini-claude-code scaffold）；根 .dockerignore 负责上下文瘦身
  runner:
    build:
      context: ..
      dockerfile: eval-platform/runner/Dockerfile
    environment:
      EVAL_SERVER_URL: http://server:8081
      RUNNER_SECRET: ${RUNNER_SECRET:-dev-runner-secret}
      # mcc 的 LLM 凭证（环境变量自动探测，二选一即可）；
      # 未设置时 mini-claude-code 任务会在调用模型时报错
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      server: { condition: service_healthy }
    deploy:
      replicas: 2
    restart: unless-stopped
    logging: *default-logging

  # ── React 前端 ──────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "${WEB_PORT:-5173}:8081"
    depends_on: [server]
    logging: *default-logging

  # ── Prometheus ──────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.12.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on: [server]
    logging: *default-logging

  # ── Grafana ─────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:13.0.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus]
    logging: *default-logging

volumes:
  pgdata:
  traces:
  promdata:
  grafanadata:

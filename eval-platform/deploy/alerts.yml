# 生产必装的两条告警：队列积压通知 oncall，通过率劣化通知算法团队
groups:
  - name: eval-platform
    rules:
      - alert: EvalQueueBacklog
        expr: eval_queue_depth > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "评测队列积压 {{ $value }} 个任务"
          description: "队列深度持续 5 分钟超过 50，runner 可能全部失联或鉴权失败。"

      - alert: EvalPassRateLow
        expr: |
          sum(rate(eval_runs_total{status="passed"}[1h]))
            / sum(rate(eval_runs_total[1h])) < 0.6
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "评测通过率 1 小时内低于 60%"
          description: "检查最近批次的 error message：模型 API 限速或沙箱故障的典型信号。"

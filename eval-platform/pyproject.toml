[project]
name = "eval-platform"
version = "0.1.0"
description = "Agent 评测平台：批量执行、轨迹回放、版本对比与统计报表"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

[tool.uv.workspace]
members = ["server", "runner"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"server/tests/*" = ["F401"]
"runner/tests/*" = ["F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["server/tests", "runner/tests"]
